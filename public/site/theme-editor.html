<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="Create a custom Termiview theme." /><title>Theme editor · Termiview</title><link rel="stylesheet" href="landing.css" /><link rel="stylesheet" href="theme-editor.css" /><link rel="stylesheet" href="theme-preview-scale.css" /></head>
<body><header class="site-header"><a class="topbar-mark" href="/site" aria-label="Termiview home"><img src="assets/termiview-mark.png" alt="" /><span>Termiview</span></a><nav><a href="/site">Back to site</a></nav></header>
<main class="theme-editor-page"><section class="editor-intro"><h1>Make the workspace <em>yours.</em></h1><p>Create a theme, download its JSON file, then load it from Settings in your Termiview instance.</p></section><section class="editor-layout" aria-label="Theme editor"><form id="theme-form" class="theme-controls"><label class="theme-name">Theme name<input id="theme-name" value="Midnight blue" maxlength="48" /></label><div id="color-controls" class="color-controls"></div><div class="editor-actions"><button type="button" id="reset-theme" class="button button-quiet">Reset</button><button type="submit" class="button button-primary">Download theme <span>↓</span></button></div></form><div class="preview-shell"><p class="preview-label">Preview</p><div id="theme-preview-stage" class="preview-stage"><iframe id="theme-preview" class="app-preview" src="../index.html?demo=1&theme-preview=1" title="Static Termiview theme demo"></iframe></div><p class="preview-note">This is the real Termiview interface with hardcoded mock data; its controls are disabled.</p></div></section></main><script src="theme-editor.js"></script><script src="theme-preview-scale.js"></script></body></html>
